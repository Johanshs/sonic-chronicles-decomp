[workspace]
resolver = "2"
members = ["crates/sonic-formats", "crates/sonic-dump", "crates/sonic-mod"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# A tabela de nomes de colunas GDA vem do xoreos (GPLv3), por isso o projeto é GPL-3.0.
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
