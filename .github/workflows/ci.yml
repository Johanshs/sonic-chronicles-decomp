# CI: compila e testa tudo que não precisa da ROM.
# (Os testes com a ROM real rodam localmente: SONIC_ROM=rom.nds cargo test.)
name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # versão fixa: o mesmo Rust do desenvolvimento (lints novos não quebram a CI de surpresa)
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy }
      - name: compilar (engine)
        working-directory: engine
        run: cargo build --release --locked
      - name: clippy (engine)
        working-directory: engine
        run: cargo clippy --release -- -D warnings
      - name: testes (engine)
        working-directory: engine
        run: cargo test --release
      - name: exemplo mínimo
        working-directory: exemplos/rust-minimo
        run: cargo test --release
  c-e-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: compilar as funções em C
        run: make -C decomp build/test_hash build/test_language && ./decomp/build/test_language
      - name: sintaxe dos scripts
        run: |
          python3 -m py_compile analise/tools/*.py modmenu/ferramentas/*.py
          bash -n analise/run_all.sh
      # o painel (modmenu/) compila com -Werror e precisa caber nos 32 KB reservados
      # (o painel.ld recusa ligar se passar)
      - name: compilar o painel de controle
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          make -C modmenu build/painel_jogo.elf
