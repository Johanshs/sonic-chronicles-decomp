# CI: compila e testa tudo que não precisa da ROM.
# (Os testes com a ROM real rodam localmente: SONIC_ROM=rom.nds cargo test.)
name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # versão fixa: o mesmo Rust do desenvolvimento (lints novos não quebram a CI de surpresa)
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy }
      - name: compilar (engine)
        working-directory: engine
        run: cargo build --release --locked
      - name: clippy (engine)
        working-directory: engine
        run: cargo clippy --release -- -D warnings
      - name: testes (engine)
        working-directory: engine
        run: cargo test --release
      - name: exemplo mínimo
        working-directory: exemplos/rust-minimo
        run: cargo test --release
  c-e-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: compilar as funções em C
        run: make -C decomp build/test_hash build/test_language && ./decomp/build/test_language
      - name: sintaxe dos scripts
        run: |
          python3 -m py_compile analise/tools/*.py
          bash -n analise/run_all.sh
      - name: testes dos scripts (cheats AR e usrcheat.dat)
        run: python3 -m unittest discover -s analise/tools -p 'test_*.py'
      - name: forma dos cheats do projeto
        run: python3 analise/tools/ar_codes.py validar cheats/YWSE.txt
