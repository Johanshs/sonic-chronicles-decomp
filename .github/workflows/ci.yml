# CI: compila e testa tudo que não precisa da ROM.
# (Os testes com a ROM real rodam localmente: SONIC_ROM=rom.nds cargo test.)
name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # versão fixa: o mesmo Rust do desenvolvimento (lints novos não quebram a CI de surpresa)
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy }
      - name: compilar (engine)
        working-directory: engine
        run: cargo build --release --locked
      - name: clippy (engine)
        working-directory: engine
        run: cargo clippy --release -- -D warnings
      - name: testes (engine)
        working-directory: engine
        run: cargo test --release
      - name: exemplo mínimo
        working-directory: exemplos/rust-minimo
        run: cargo test --release
  c-e-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: compilar as funções em C
        run: make -C decomp build/test_hash build/test_language && ./decomp/build/test_language
      - name: sintaxe dos scripts
        run: |
          python3 -m py_compile analise/tools/*.py decomp/tools/*.py
          bash -n analise/run_all.sh
          for f in decomp/tools/*.sh; do bash -n "$f"; done
  decomp-matching:
    # Confere, sem a ROM, que o C++ de src/ continua compilando para os mesmos
    # bytes do jogo (decomp/compilador/esperado.txt guarda só o SHA-1 deles).
    # O build completo, com a ROM, é o decomp/tools/montar_rom.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: work/ferramentas
          key: ferramentas-${{ hashFiles('decomp/tools/ferramentas.sh') }}
      - name: ferramentas (dsd, wibo, mwccarm)
        run: decomp/tools/ferramentas.sh
      - name: dependências Python
        run: python3 -m pip install --user --break-system-packages pyelftools capstone
      - name: funções decompiladas batem com o jogo
        run: python3 decomp/tools/conferir_sem_rom.py
